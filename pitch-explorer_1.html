<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --panel-deep: #171D24;
    --panel-edge: #2E3845;
    --recess:     #10151A;
    --amber:      #F2A65A;
    --amber-dim:  #8A6236;
    --cyan:       #7FD4CB;
    --cyan-dim:   #3F6E69;
    --ink:        #94A3B4;
    --ink-faint:  #4C5A6B;
    --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  .rig {
    font-family: var(--mono);
    background: var(--panel-deep);
    background-image: linear-gradient(180deg, rgba(255,255,255,.028), rgba(0,0,0,.18));
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    padding: 18px;
    max-width: 720px;
    margin: 0 auto;
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
  }

  .bar {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-bottom: 16px;
  }
  .btn {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    background: var(--recess);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    padding: 7px 11px;
    cursor: pointer;
    transition: color .15s, border-color .15s, background .15s;
  }
  .btn:hover { color: var(--ink); }
  .btn[aria-pressed="true"] {
    color: var(--amber);
    border-color: var(--amber-dim);
    background: #1C1811;
  }
  .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .btn-sound { margin-right: auto; }
  .btn-sound[aria-pressed="true"] {
    color: var(--cyan);
    border-color: var(--cyan-dim);
    background: #111A19;
  }

  .stage {
    display: grid;
    grid-template-columns: 1fr 78px 1fr;
    margin-bottom: 16px;
  }

  .readout { position: relative; height: 420px; }
  .readout-inner {
    position: absolute;
    left: 0; right: 0;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .side-freq .readout-inner { justify-content: flex-end; }
  .side-note .readout-inner { justify-content: flex-start; }
  .leader { flex: 1; height: 1px; background: var(--panel-edge); min-width: 12px; }

  .val { line-height: 1.15; white-space: nowrap; }
  .side-freq { text-align: right; }
  .side-freq .val { font-size: 30px; color: var(--amber); }
  .side-note .val { font-size: 34px; color: var(--cyan); }
  .side-note .alt { font-size: 12px; color: var(--cyan-dim); margin-top: 7px; }

  .track {
    position: relative;
    height: 420px;
    background: var(--recess);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    cursor: ns-resize;
    overflow: hidden;
    touch-action: none;
  }
  .track:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .tick {
    position: absolute;
    height: 1px;
    right: 0; width: 9px;
    background: var(--ink-faint);
    opacity: .3;
  }
  .tick.octave { left: 0; width: 100%; background: var(--panel-edge); opacity: 1; }

  .handle {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 2px solid var(--amber);
    box-shadow: 0 0 12px rgba(242,166,90,.55);
    pointer-events: none;
  }
  .handle::after {
    content: "";
    position: absolute;
    left: 50%; top: -4px;
    width: 7px; height: 7px;
    margin-left: -3.5px;
    background: var(--amber);
    border-radius: 50%;
  }

  .scope-wrap {
    background: var(--recess);
    border: 1px solid var(--panel-edge);
    border-radius: 3px;
    overflow: hidden;
  }
  .scope { display: block; width: 100%; height: 96px; }

  @media (max-width: 560px) {
    .stage { grid-template-columns: 1fr 56px 1fr; }
    .side-freq .val { font-size: 21px; }
    .side-note .val { font-size: 24px; }
    .readout, .track { height: 330px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="rig">

  <div class="bar">
    <button class="btn btn-sound" id="power" aria-pressed="false">Sound off</button>
    <button class="btn" data-wave="sine"     aria-pressed="true">Sine</button>
    <button class="btn" data-wave="square"   aria-pressed="false">Square</button>
    <button class="btn" data-wave="sawtooth" aria-pressed="false">Saw</button>
    <button class="btn" data-wave="triangle" aria-pressed="false">Tri</button>
  </div>

  <div class="stage">
    <div class="readout side-freq">
      <div class="readout-inner" id="freqBox">
        <div class="val" id="freqNum">440 Hz</div>
        <div class="leader"></div>
      </div>
    </div>

    <div class="track" id="track" tabindex="0" role="slider"
         aria-label="Pitch" aria-valuemin="36" aria-valuemax="96"
         aria-valuenow="69" aria-valuetext="A4, 440 hertz">
      <div class="handle" id="handle"></div>
    </div>

    <div class="readout side-note">
      <div class="readout-inner" id="noteBox">
        <div class="leader"></div>
        <div>
          <div class="val" id="noteNum">A4</div>
          <div class="alt" id="noteAlt">&nbsp;</div>
        </div>
      </div>
    </div>
  </div>

  <div class="scope-wrap"><canvas class="scope" id="scope"></canvas></div>

</div>

<script>
(function () {
  "use strict";

  var MIN_MIDI = 36, MAX_MIDI = 96, SPAN = MAX_MIDI - MIN_MIDI;
  var SHARP = ["C","C\u266F","D","D\u266F","E","F","F\u266F","G","G\u266F","A","A\u266F","B"];
  var FLAT  = ["C","D\u266D","D","E\u266D","E","F","G\u266D","G","A\u266D","A","B\u266D","B"];

  var midi = 69, wave = "sine", soundOn = false;

  var track  = document.getElementById("track"),
      handle = document.getElementById("handle"),
      freqBox= document.getElementById("freqBox"),
      noteBox= document.getElementById("noteBox"),
      freqNum= document.getElementById("freqNum"),
      noteNum= document.getElementById("noteNum"),
      noteAlt= document.getElementById("noteAlt"),
      power  = document.getElementById("power"),
      scope  = document.getElementById("scope"),
      c2d    = scope.getContext("2d");

  function freqOf(m) { return 440 * Math.pow(2, (m - 69) / 12); }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function fracOf(m) { return (m - MIN_MIDI) / SPAN; }

  function nameOf(m) {
    var pc = ((m % 12) + 12) % 12, oct = Math.floor(m / 12) - 1;
    var s = SHARP[pc] + oct, f = FLAT[pc] + oct;
    return { primary: s, alt: s === f ? "" : f };
  }

  /* audio */
  var audio = null, osc = null, gain = null;

  function ensureAudio() {
    if (audio) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = new AC();
    gain = audio.createGain();
    gain.gain.value = 0;
    gain.connect(audio.destination);
    osc = audio.createOscillator();
    osc.type = wave;
    osc.frequency.value = freqOf(midi);
    osc.connect(gain);
    osc.start();
  }

  function setSound(on) {
    soundOn = on;
    power.setAttribute("aria-pressed", String(on));
    power.textContent = on ? "Sound on" : "Sound off";
    if (!on) { if (gain) gain.gain.setTargetAtTime(0, audio.currentTime, 0.015); return; }
    ensureAudio();
    if (!audio) return;
    if (audio.state === "suspended") audio.resume();
    gain.gain.setTargetAtTime(0.14, audio.currentTime, 0.02);
  }

  /* ticks */
  for (var m = MIN_MIDI; m <= MAX_MIDI; m++) {
    var el = document.createElement("div");
    el.className = "tick" + ((((m % 12) + 12) % 12) === 0 ? " octave" : "");
    el.style.top = ((1 - fracOf(m)) * 100) + "%";
    track.appendChild(el);
  }

  /* scope */
  function sampleWave(type, phase) {
    var p = phase - Math.floor(phase);
    if (type === "square")   return p < 0.5 ? 1 : -1;
    if (type === "sawtooth") return 2 * p - 1;
    if (type === "triangle") return p < 0.5 ? (4 * p - 1) : (3 - 4 * p);
    return Math.sin(2 * Math.PI * p);
  }

  function drawScope() {
    var dpr = window.devicePixelRatio || 1,
        w = scope.clientWidth, h = scope.clientHeight;
    if (!w || !h) return;
    scope.width = w * dpr; scope.height = h * dpr;
    c2d.setTransform(dpr, 0, 0, dpr, 0, 0);
    c2d.clearRect(0, 0, w, h);

    var cycles = freqOf(midi) * 0.02;
    if (cycles > 22) cycles = 22;

    c2d.strokeStyle = "#2E3845"; c2d.lineWidth = 1;
    c2d.beginPath(); c2d.moveTo(0, h / 2); c2d.lineTo(w, h / 2); c2d.stroke();

    var amp = h * 0.34, steps = Math.max(w * 3, 900);
    c2d.strokeStyle = "#F2A65A"; c2d.lineWidth = 1.6; c2d.lineJoin = "round";
    c2d.beginPath();
    for (var i = 0; i <= steps; i++) {
      var x = (i / steps) * w,
          y = h / 2 - sampleWave(wave, (i / steps) * cycles) * amp;
      if (i === 0) c2d.moveTo(x, y); else c2d.lineTo(x, y);
    }
    c2d.stroke();
  }

  function render() {
    var pct = (1 - fracOf(midi)) * 100;
    handle.style.top = pct + "%";
    freqBox.style.top = pct + "%";
    noteBox.style.top = pct + "%";

    var f = freqOf(midi);
    freqNum.textContent = (f < 100 ? f.toFixed(1) : Math.round(f)) + " Hz";

    var n = nameOf(midi);
    noteNum.textContent = n.primary;
    noteAlt.innerHTML = n.alt || "&nbsp;";

    track.setAttribute("aria-valuenow", midi);
    track.setAttribute("aria-valuetext", n.primary + ", " + Math.round(f) + " hertz");

    drawScope();
    if (osc && audio) osc.frequency.setTargetAtTime(f, audio.currentTime, 0.012);
  }

  function setMidi(m) {
    var next = clamp(Math.round(m), MIN_MIDI, MAX_MIDI);
    if (next === midi) return;
    midi = next;
    render();
  }

  /* drag */
  function midiFromEvent(e) {
    var r = track.getBoundingClientRect();
    var y = clamp(e.clientY - r.top, 0, r.height);
    return MIN_MIDI + (1 - y / r.height) * SPAN;
  }

  var dragging = false;

  track.addEventListener("pointerdown", function (e) {
    dragging = true;
    track.setPointerCapture(e.pointerId);
    track.focus();
    if (!soundOn) setSound(true);
    setMidi(midiFromEvent(e));
    e.preventDefault();
  });

  track.addEventListener("pointermove", function (e) {
    if (dragging) setMidi(midiFromEvent(e));
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    try { track.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", endDrag);

  track.addEventListener("keydown", function (e) {
    if (e.key === "ArrowUp")        setMidi(midi + 1);
    else if (e.key === "ArrowDown") setMidi(midi - 1);
    else if (e.key === "PageUp")    setMidi(midi + 12);
    else if (e.key === "PageDown")  setMidi(midi - 12);
    else if (e.key === " ")         setSound(!soundOn);
    else return;
    e.preventDefault();
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-wave]"), function (b) {
    b.addEventListener("click", function () {
      wave = b.dataset.wave;
      Array.prototype.forEach.call(document.querySelectorAll("[data-wave]"), function (o) {
        o.setAttribute("aria-pressed", String(o === b));
      });
      if (osc) osc.type = wave;
      drawScope();
    });
  });

  power.addEventListener("click", function () { setSound(!soundOn); });
  window.addEventListener("resize", drawScope);

  render();
})();
</script>
